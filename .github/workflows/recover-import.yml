name: Recover source import
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-import.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package interrupted transfer for checksum verification
        run: |
          python - <<'PY'
          import pathlib, zipfile, json, hashlib
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('import-recovery.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.glob('.bootstrap/*')):
                  if p.is_file(): z.write(p, str(p.relative_to(root)))
              z.writestr('tree-manifest.json', json.dumps({str(p.relative_to(root)): {'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name != 'import-recovery.zip'}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: import-recovery
          path: import-recovery.zip
          retention-days: 7
      - name: Enable Actions-based Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json" 2> "$RUNNER_TEMP/pages-error.txt"; then
            cat "$RUNNER_TEMP/pages.json"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow || {
              echo '::warning::Pages site creation requires repository administration access not granted to this workflow token.'
            }
          fi
