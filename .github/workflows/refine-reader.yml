name: Refine performance reader
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/refine-reader.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply tested reader refinement and repeat every acceptance gate
        run: |
          git diff --exit-code b07ff96f085e0845c05a354c7a5c2ef8fdc4a9af HEAD -- packages scripts tests docs README.md package.json package-lock.json
          python -m pip install PyYAML==6.0.2 --quiet
          python .bootstrap/refine-reader.py
          python - <<'PY'
          from pathlib import Path
          import shutil,subprocess,yaml
          # Earlier measurements are retained in Git history, never reused as fresh evidence.
          shutil.rmtree('artifacts/v0.6.0')
          workflow=yaml.safe_load(Path('.github/workflows/upgrade-performance.yml').read_text())
          steps=[s for s in workflow['jobs']['validate-and-commit']['steps'] if 'run' in s and s['name']!='Verify source base and exact performance patch']
          for step in steps:
              print('EXECUTE',step['name'],flush=True)
              code=step['run']
              if step['name']=='Record separate CPU profiles without instrumenting the headline benchmarks':
                  code=code.replace('--case semantic-classification,compound-fill,shared-complex-clipping','--case semantic-classification,compound-fill,shared-complex-clipping,dxf-read-groups')
              if step['name']=='Record measured acceptance and commit the complete performance release':
                  code=code.replace('tests>=205','tests>=209')
                  code=code.replace("summary={'version':'0.6.0',", "summary={'version':'0.6.0','sourceRefinement':'Browser-mapped snapshot/BVH helpers and fused section-record DXF scanner; small-record scalar fast path; first-occurrence and section/budget regressions.',")
                  code=code.replace("git commit -m 'Optimize vector conversion, semantic transactions and worker reuse (v0.6.0)'", "git commit -m 'Fuse DXF scanning and record decoding; verify all performance workloads (v0.6.0)'")
              subprocess.run(['bash','-e','-o','pipefail','-c',code],check=True)
          assert any(s['name']=='Record measured acceptance and commit the complete performance release' for s in steps)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-performance-acceptance
          path: |
            artifacts/v0.6.0/
            artifacts/performance-browser/
            release/npm/
          retention-days: 14
