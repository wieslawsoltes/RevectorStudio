name: Publish and verify GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build and test dependencies
        run: |
          npm install --ignore-scripts --omit=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
          python -m pip install -r tests/requirements.txt --quiet
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Build and validate conversion engines
        run: |
          npm run build
          npm test
          npm run test:types
          npm run test:dxf
      - name: Record the exact deployment revision
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('dist')
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()}
          (root/'deployment.json').write_text(json.dumps({'repository':os.environ['GITHUB_REPOSITORY'],'commit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'files':files},indent=2)+'\n')
          (root/'.nojekyll').touch()
          PY
      - name: Test the production build at a repository-prefixed HTTP URL
        run: python tests/pages.py --sha "$GITHUB_SHA" --output artifacts/pages-local
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-build-validation
          path: artifacts/pages-local
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live-site verification dependencies
        run: |
          python -m pip install -r tests/requirements.txt --quiet
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Verify the public HTTPS deployment and download a valid DXF
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/pages.py --url "$SITE_URL" --sha "$GITHUB_SHA" --output artifacts/pages-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-live-validation
          path: artifacts/pages-live
          retention-days: 14
