name: Complete verified recovery v0.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/finish-v05.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified source, run all acceptance gates and commit distributions
        run: |
          python -m pip install PyYAML==6.0.2 --quiet
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          workflow=yaml.safe_load(Path('.github/workflows/upgrade-v05.yml').read_text())
          executed=0
          for step in workflow['jobs']['validate-and-commit']['steps']:
              if 'run' not in step:
                  continue
              print('EXECUTE',step['name'],flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],check=True)
              executed+=1
              if step['name']=='Apply independently tested floating-point precision guard':
                  p=Path('tests/extensions_browser.py');s=p.read_text()
                  old='workbench.engine.rules.length===18';assert s.count(old)==1
                  p.write_text(s.replace(old,'workbench.engine.rules.length===20'))
          assert executed==8,executed
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-v05-validation
          path: |
            artifacts/
            release/npm/
            ${{ runner.temp }}/node-tests.log
            ${{ runner.temp }}/v05-revision.txt
          retention-days: 14
