name: Finalize performance v0.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/upgrade-performance.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source base and exact performance patch
        run: |
          git diff --exit-code 88491a3fe51779ad4a750b448afebae57a56ff7b HEAD -- packages scripts tests docs README.md package.json package-lock.json
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib
          encoded=''.join(pathlib.Path(f'.bootstrap/performance-{i}.b64').read_text().strip() for i in range(4))
          data=base64.b64decode(encoded,validate=True)
          actual=hashlib.sha256(data).hexdigest()
          assert actual=='6faebc48ba62072cd5c8f2c6c0f53e4bbe8106211c72fbcf7a84286e6b1e93e7',actual
          pathlib.Path(os.environ['RUNNER_TEMP'],'performance.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --unidiff-zero --check "$RUNNER_TEMP/performance.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/performance.patch"
      - name: Install locked dependencies and author the performance PDF
        run: |
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
          python -m pip install -r tests/requirements.txt --quiet
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/browser-install.log"; exit 1; }
          python tests/performance_fixture.py
          mkdir -p artifacts/v0.6.0/performance
      - name: Build and validate source, types and established browser behavior
        run: |
          npm run build
          npm test | tee artifacts/v0.6.0/node-tests.log
          npm run test:types
          npm run test:browser
          npm run test:extensions
          npm run test:recovery
          npm run test:images
          npm run test:appearance
      - name: Verify actual browser worker reuse, reference caching and cancellation
        run: npm run test:performance:browser
      - name: Verify native CLI, corpus and independent DXF audits
        run: |
          npm run test:images:cli
          npm run test:appearance:cli
          python tests/ocr_cli.py
          python scripts/validate-corpus.py examples/corpus.json --output "$RUNNER_TEMP/revector-corpus"
          npm run test:dxf
      - name: Prepare an isolated original baseline without shared workspace links
        run: |
          git worktree add --detach "$RUNNER_TEMP/revector-baseline" 3b3bf2101c92da8f50773fe62f14c092cf31b935
          cd "$RUNNER_TEMP/revector-baseline"
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
      - name: Verify differential correctness and measure identical before-after workloads
        run: |
          node scripts/verify-performance-equivalence.mjs --baseline "$RUNNER_TEMP/revector-baseline" --output artifacts/v0.6.0/performance/equivalence.json
          node scripts/compare-performance.mjs --baseline "$RUNNER_TEMP/revector-baseline" --output artifacts/v0.6.0/performance --repeats 3 --warmups 1
      - name: Record separate CPU profiles without instrumenting the headline benchmarks
        run: |
          mkdir -p artifacts/v0.6.0/profiles
          node --expose-gc --cpu-prof --cpu-prof-dir=artifacts/v0.6.0/profiles --cpu-prof-name=before.cpuprofile scripts/benchmark-performance.mjs --root "$RUNNER_TEMP/revector-baseline" --case semantic-classification,compound-fill,shared-complex-clipping --repeats 1 --warmups 0 --label before-profile --output artifacts/v0.6.0/profiles/before.json
          node --expose-gc --cpu-prof --cpu-prof-dir=artifacts/v0.6.0/profiles --cpu-prof-name=after.cpuprofile scripts/benchmark-performance.mjs --case semantic-classification,compound-fill,shared-complex-clipping --repeats 1 --warmups 0 --label after-profile --output artifacts/v0.6.0/profiles/after.json
      - name: Pack and validate sixteen offline-consumable packages
        run: |
          npm run pack:all
          node scripts/publish-npm.mjs --dry-run
          export PACKAGE_ROOT="$GITHUB_WORKSPACE/release/npm"
          mkdir "$RUNNER_TEMP/performance-consumer"
          cd "$RUNNER_TEMP/performance-consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund "$PACKAGE_ROOT"/*.tgz
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const records=JSON.parse(fs.readFileSync(process.env.PACKAGE_ROOT+'/manifest.json','utf8'));
          if(records.length!==16)throw Error('Expected sixteen packages');
          for(const r of records){
            if(r.version!=='0.6.0')throw Error('Unexpected version '+r.name);
            const digest=createHash('sha256').update(fs.readFileSync(process.env.PACKAGE_ROOT+'/'+r.file)).digest('hex');
            if(digest!==r.sha256)throw Error('Archive checksum mismatch '+r.name);
            await import(r.name);console.log('PASS isolated import',r.name);
          }
          JS
      - name: Record measured acceptance and commit the complete performance release
        run: |
          python - <<'PY'
          import json,os,pathlib,re,shutil
          root=pathlib.Path.cwd();out=root/'artifacts/v0.6.0'
          node=(out/'node-tests.log').read_text();tests=int(re.search(r'# tests (\d+)',node)[1])
          assert tests>=205 and '# fail 0' in node and '# skipped 0' in node
          equivalence=json.loads((out/'performance/equivalence.json').read_text())
          comparison=json.loads((out/'performance/comparison.json').read_text())
          assert equivalence['passed'] and equivalence['checks']==746
          assert comparison['passed'] and len(comparison['cases'])==13
          reports={}
          for name in ['browser-validation.json','extensions/validation.json','recovery-next/validation.json','images-browser/validation.json','appearance/validation.json','performance-browser/validation.json','images-cli/validation.json','appearance-cli/validation.json','ocr-cli/validation.json','dxf-validation.json','npm-publication/validation.json']:
              source=root/'artifacts'/name;reports[name]=json.loads(source.read_text());shutil.copyfile(source,out/name.replace('/','-'))
          perf=reports['performance-browser/validation.json'];assert perf['passed']==11 and not perf['errors']
          dxf=reports['dxf-validation.json'];assert dxf['auditErrors']==dxf['auditFixes']==0
          corpus=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'revector-corpus/validation.json').read_text());assert corpus['passed']
          (out/'corpus-validation.json').write_text(json.dumps(corpus,indent=2)+'\n')
          summary={'version':'0.6.0','sourceBase':'3b3bf2101c92da8f50773fe62f14c092cf31b935','sourcePayloadSha256':'6faebc48ba62072cd5c8f2c6c0f53e4bbe8106211c72fbcf7a84286e6b1e93e7','workflowRun':os.environ['GITHUB_RUN_ID'],'nodeTests':tests,'nodeFailures':0,'differentialChecks':equivalence['checks'],'benchmarkCases':len(comparison['cases']),'benchmarkOutputEquality':True,'originalBrowserChecks':35,'ocrColorChecks':21,'tiledOcrChecks':14,'imageBrowserChecks':23,'appearanceBrowserChecks':14,'performanceBrowserChecks':perf['passed'],'baselineDxfFiles':dxf['files'],'isolatedNpmImports':16,'npmPublication':'not-attempted; archives and dry run only','qualification':'Authored same-machine workloads, not measurements of user-supplied slow PDFs. OCR accuracy/settings, geometric tolerances, rules, diagnostics and validation remain unchanged.'}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          table=(out/'performance/comparison.md').read_text()
          (root/'docs/VALIDATION-0.6.md').write_text('# Version 0.6.0 performance acceptance\n\nThe source update passed '+str(tests)+' Node unit/integration tests with zero failures/skips, strict TypeScript checking, 746 exact differential checks against v0.5.0 and thirteen correctness-hashed before/after benchmarks. Both measured processes ran without CPU-profile instrumentation; separate profiles are supplied. Median times use one excluded warmup and three measured repetitions on the same GitHub runner. Timing ratios are observations, not brittle CI gates.\n\n'+table+'\n## Browser and export gates\n\nActual HTTP browser tests passed: 35 original UI checks, 21 OCR/color checks, 14 tiled OCR checks, 23 native IMAGE checks, 14 sampled-appearance checks and 11 new worker-reuse/reference-cache/cancellation checks. The native CLI, SHA-pinned corpus and independent baseline audit passed; the latter contains '+str(dxf['files'])+' generated DXFs with zero errors or automatic fixes. Full tolerances, rules and validation are retained.\n\nAll sixteen 0.6.0 package archives were verified, installed and imported in an isolated offline consumer. No npm registry publication was attempted. No customer slow PDF was supplied; the measurements cover authored representative workloads. OCR recognition throughput was not benchmarked and its model/settings remain unchanged. General structural validation and transactional shell copying remain linear per accepted candidate; degenerate geometry and very large rasters can still be expensive. See PERFORMANCE.md for ownership, cancellation, budget and timing details.\n\nEvidence: `artifacts/v0.6.0/`. Source acceptance run: https://github.com/wieslawsoltes/RevectorStudio/actions/runs/'+os.environ['GITHUB_RUN_ID']+'. Public HTTPS deployment is a separate gate.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages scripts tests docs README.md package.json package-lock.json assets/performance-stress.pdf
          git add -f -- apps/studio/conversion-worker.js apps/studio/offline-bootstrap.js revector-studio.html release/npm artifacts/v0.6.0
          git commit -m 'Optimize vector conversion, semantic transactions and worker reuse (v0.6.0)'
          git push origin HEAD:main
          git rev-parse HEAD > artifacts/v0.6.0/committed-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-performance-acceptance
          path: |
            artifacts/v0.6.0/
            artifacts/performance-browser/
            release/npm/
          retention-days: 14
