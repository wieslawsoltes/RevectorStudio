name: Complete performance v0.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/finish-performance.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified source, repair browser module exposure, validate and commit
        run: |
          python -m pip install PyYAML==6.0.2 --quiet
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          workflow=yaml.safe_load(Path('.github/workflows/upgrade-performance.yml').read_text())
          steps=[s for s in workflow['jobs']['validate-and-commit']['steps'] if 'run' in s]
          for step in steps:
              print('EXECUTE',step['name'],flush=True)
              code=step['run']
              if step['name']=='Record measured acceptance and commit the complete performance release':
                  code=code.replace("summary={'version':'0.6.0',", "summary={'version':'0.6.0','sourceRefinement':'Snapshot and BVH helpers are routed through mapped package entry points; the browser module graph is regression-tested.',")
              subprocess.run(['bash','-e','-o','pipefail','-c',code],check=True)
              if step['name']=='Verify source base and exact performance patch':
                  edits=[('packages/semantics/src/index.js',"import {markImmutableSnapshot} from '@revector/model/snapshot.js';","import {_markImmutableSnapshot as markImmutableSnapshot} from '@revector/model';"),('packages/rules-document/src/index.js',"import {isImmutableSnapshot} from '@revector/model/snapshot.js';","import {_isImmutableSnapshot as isImmutableSnapshot} from '@revector/model';"),('packages/topology/src/index.js',"import { BoxIndex } from '@revector/geometry/spatial.js';","import { BoxIndex } from '@revector/geometry';")]
                  for name,old,new in edits:
                      p=Path(name);s=p.read_text();assert s.count(old)==1,name;p.write_text(s.replace(old,new))
                  p=Path('packages/model/src/index.js');p.write_text("export {markImmutableSnapshot as _markImmutableSnapshot, isImmutableSnapshot as _isImmutableSnapshot} from './snapshot.js';\n"+p.read_text())
                  p=Path('packages/model/src/index.d.ts');p.write_text(p.read_text()+'\n/** @internal Owned snapshot identity shared between package entry points. */\nexport declare function _markImmutableSnapshot<T extends object>(document: T): T;\n/** @internal Only marks produced by the rule engine qualify for memoization. */\nexport declare function _isImmutableSnapshot(document: object): boolean;\n')
                  p=Path('packages/geometry/src/index.js');p.write_text(p.read_text()+"\nexport {BoxIndex} from './spatial.js';\n")
                  p=Path('packages/geometry/src/index.d.ts');p.write_text(p.read_text()+'\n/** Static BVH with deterministic query order. Do not mutate indexed bounds. */\nexport declare class BoxIndex<T = unknown> {\n    constructor(items?: T[], getBox?: (item: T) => Box);\n    items: T[];\n    getBox: (item: T) => Box;\n    visit(box: Box, callback: (item: T) => void): void;\n    search(box: Box): T[];\n}\n')
                  Path('tests/browser-imports.test.mjs').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import ts from 'typescript';
          const root=path.resolve(import.meta.dirname,'..');
          test('Every static cross-package browser import resolves through the shipped import map',()=>{
              const html=fs.readFileSync(path.join(root,'index.html'),'utf8');
              const map=JSON.parse(html.match(/<script type="importmap">([^]*?)<\/script>/)[1]).imports;
              let checked=0;
              for(const file of fs.readdirSync(path.join(root,'packages'),{recursive:true}).filter(x=>x.includes('/src/')&&x.endsWith('.js'))){
                  const source=ts.createSourceFile(file,fs.readFileSync(path.join(root,'packages',file),'utf8'),ts.ScriptTarget.ESNext,true,ts.ScriptKind.JS);
                  for(const statement of source.statements){
                      if(!(ts.isImportDeclaration(statement)||ts.isExportDeclaration(statement))||!statement.moduleSpecifier)continue;
                      const spec=statement.moduleSpecifier.text;
                      if(!spec.startsWith('@revector/'))continue;
                      checked++;
                      const prefix=Object.keys(map).filter(k=>k.endsWith('/')&&spec.startsWith(k)).sort((a,b)=>b.length-a.length)[0];
                      const target=map[spec]||(prefix?map[prefix]+spec.slice(prefix.length):null);
                      assert.ok(target,`${file}: unmapped browser import ${spec}`);
                      assert.ok(fs.statSync(path.resolve(root,target)).isFile(),`${file}: missing import target ${target}`);
                  }
              }
              assert.ok(checked>50,'The actual package dependency graph was traversed');
          });
          ''')
          assert any(s['name']=='Record measured acceptance and commit the complete performance release' for s in steps)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-performance-acceptance
          path: |
            artifacts/v0.6.0/
            artifacts/performance-browser/
            release/npm/
          retention-days: 14
