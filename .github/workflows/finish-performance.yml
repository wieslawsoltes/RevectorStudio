name: Complete performance v0.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/finish-performance.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified source, repair browser module exposure, validate and commit
        run: |
          python -m pip install PyYAML==6.0.2 --quiet
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          workflow=yaml.safe_load(Path('.github/workflows/upgrade-performance.yml').read_text())
          steps=[s for s in workflow['jobs']['validate-and-commit']['steps'] if 'run' in s]
          for step in steps:
              print('EXECUTE',step['name'],flush=True)
              code=step['run']
              if step['name']=='Record measured acceptance and commit the complete performance release':
                  code=code.replace("summary={'version':'0.6.0',", "summary={'version':'0.6.0','sourceRefinement':'Internal snapshot helper is routed through the existing model entry point for browser import-map compatibility.',")
              subprocess.run(['bash','-e','-o','pipefail','-c',code],check=True)
              if step['name']=='Verify source base and exact performance patch':
                  edits=[('packages/semantics/src/index.js',"import {markImmutableSnapshot} from '@revector/model/snapshot.js';","import {_markImmutableSnapshot as markImmutableSnapshot} from '@revector/model';"),('packages/rules-document/src/index.js',"import {isImmutableSnapshot} from '@revector/model/snapshot.js';","import {_isImmutableSnapshot as isImmutableSnapshot} from '@revector/model';")]
                  for name,old,new in edits:
                      p=Path(name);s=p.read_text();assert s.count(old)==1,name;p.write_text(s.replace(old,new))
                  p=Path('packages/model/src/index.js');p.write_text("export {markImmutableSnapshot as _markImmutableSnapshot, isImmutableSnapshot as _isImmutableSnapshot} from './snapshot.js';\n"+p.read_text())
                  p=Path('packages/model/src/index.d.ts');p.write_text(p.read_text()+'\n/** @internal Owned snapshot identity shared between package entry points. */\nexport declare function _markImmutableSnapshot<T extends object>(document: T): T;\n/** @internal Only marks produced by the rule engine qualify for memoization. */\nexport declare function _isImmutableSnapshot(document: object): boolean;\n')
          assert any(s['name']=='Record measured acceptance and commit the complete performance release' for s in steps)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-performance-acceptance
          path: |
            artifacts/v0.6.0/
            artifacts/performance-browser/
            release/npm/
          retention-days: 14
