name: Accept conversion performance v0.7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/upgrade-performance-v07.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged source and exact patch checksum
        run: |
          git diff --exit-code baa492d5b7f378dc8f7f9a253f1d8bfa6a2840f9 HEAD -- packages scripts tests docs README.md package.json package-lock.json
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib
          data=base64.b64decode(''.join(pathlib.Path(f'.bootstrap/performance-v07-{i}.b64').read_text().strip() for i in range(2)),validate=True)
          actual=hashlib.sha256(data).hexdigest()
          assert actual=='ff92462d8a45d246725b07c1d855f1ee82dbb9748c046eae88c1ddf12f71f95f',actual
          pathlib.Path(os.environ['RUNNER_TEMP'],'performance-v07.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --unidiff-zero --check "$RUNNER_TEMP/performance-v07.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/performance-v07.patch"
      - name: Install current and isolated v0.6 baseline dependencies
        run: |
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
          git worktree add --detach "$RUNNER_TEMP/revector-baseline" f3dcd9fa6ecdfc4e2944379d0b59b177b7395ad7
          cd "$RUNNER_TEMP/revector-baseline"
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
      - name: Install native and browser validation dependencies
        run: |
          python -m pip install -r tests/requirements.txt --quiet
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Build, validate source and verify exact differential results
        run: |
          npm run build
          npm test | tee "$RUNNER_TEMP/node-tests.log"
          npm run test:types
          node scripts/verify-performance-equivalence.mjs --baseline "$RUNNER_TEMP/revector-baseline" --output "$RUNNER_TEMP/performance/equivalence.json"
      - name: Verify the established workbench and real HTTP recovery suites
        run: |
          npm run test:browser
          npm run test:extensions
          npm run test:recovery
          npm run test:images
          npm run test:appearance
          npm run test:performance:browser
      - name: Validate native CLI output, independent DXF audits and fresh corpus
        run: |
          npm run test:images:cli
          npm run test:appearance:cli
          python tests/ocr_cli.py
          python scripts/validate-corpus.py examples/corpus.json --output "$RUNNER_TEMP/revector-corpus"
          npm run test:dxf
      - name: Measure unprofiled same-machine medians with mandatory output equality
        run: node scripts/compare-performance.mjs --baseline "$RUNNER_TEMP/revector-baseline" --output "$RUNNER_TEMP/performance" --warmups 1 --repeats 3
      - name: Capture CPU profiles separately from measured medians
        run: node scripts/compare-performance.mjs --baseline "$RUNNER_TEMP/revector-baseline" --output "$RUNNER_TEMP/performance/profiles" --case semantic-classification,semantic-metadata-groups,dense-table-grid,sauvola-2mp --warmups 1 --repeats 1 --profile
      - name: Rebuild and dry-run all sixteen versioned package archives
        run: |
          npm run pack:all
          node scripts/publish-npm.mjs --dry-run
          export PACKAGE_ROOT="$GITHUB_WORKSPACE/release/npm"
          mkdir "$RUNNER_TEMP/v07-consumer"
          cd "$RUNNER_TEMP/v07-consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund "$PACKAGE_ROOT"/*.tgz
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const records=JSON.parse(fs.readFileSync(process.env.PACKAGE_ROOT+'/manifest.json','utf8'));
          if(records.length!==16)throw Error('Expected sixteen packages');
          for(const r of records){
            if(r.version!=='0.7.0')throw Error('Unexpected version');
            if(createHash('sha256').update(fs.readFileSync(process.env.PACKAGE_ROOT+'/'+r.file)).digest('hex')!==r.sha256)throw Error('Archive integrity mismatch');
            await import(r.name);console.log('PASS isolated import',r.name);
          }
          JS
      - name: Record measured evidence and commit accepted source and distributions
        run: |
          python - <<'PY'
          import json,os,pathlib,re,shutil
          root=pathlib.Path.cwd();temp=pathlib.Path(os.environ['RUNNER_TEMP']);out=root/'artifacts/v0.7.0';out.mkdir(parents=True,exist_ok=False)
          log=(temp/'node-tests.log').read_text();tests=int(re.search(r'# tests (\d+)',log)[1]);assert tests==224 and '# fail 0' in log and '# skipped 0' in log
          shutil.copyfile(temp/'node-tests.log',out/'node-tests.log')
          shutil.copytree(temp/'performance',out/'performance')
          eq=json.loads((out/'performance/equivalence.json').read_text());assert eq['passed'] and eq['checks']==1454
          comparison=json.loads((out/'performance/comparison.json').read_text());assert comparison['passed'] and len(comparison['cases'])==16
          reports={}
          for name in ['browser-validation.json','extensions/validation.json','recovery-next/validation.json','images-browser/validation.json','images-cli/validation.json','appearance/validation.json','appearance-cli/validation.json','performance-browser/validation.json','dxf-validation.json','npm-publication/validation.json']:
              source=root/'artifacts'/name;reports[name]=json.loads(source.read_text());shutil.copyfile(source,out/name.replace('/','-'))
          perf=reports['performance-browser/validation.json'];assert perf['passed']==14 and not perf['errors']
          dxf=reports['dxf-validation.json'];assert dxf['auditErrors']==dxf['auditFixes']==0
          shutil.copyfile(temp/'revector-corpus/validation.json',out/'corpus-validation.json')
          summary={'version':'0.7.0','baselineCommit':'f3dcd9fa6ecdfc4e2944379d0b59b177b7395ad7','sourcePayloadSha256':'ff92462d8a45d246725b07c1d855f1ee82dbb9748c046eae88c1ddf12f71f95f','workflowRun':os.environ['GITHUB_RUN_ID'],'nodeTests':tests,'nodeFailures':0,'differentialChecks':eq['checks'],'benchmarks':len(comparison['cases']),'performanceBrowserChecks':perf['passed'],'independentBaselineDxfFiles':dxf['files'],'isolatedNpmImports':16,'npmPublication':'not attempted; dry-run only','qualification':'Authored workloads, not the unsupplied slow customer PDFs. Recognition engine and quality settings are unchanged. Preprocessing timing is not full OCR throughput. Historical and current benchmark runs use different machines and are not multiplied together.'}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          table=(out/'performance/comparison.md').read_text().replace('# Same-machine conversion performance','## Same-machine v0.6 to v0.7 performance',1)
          doc='# Version 0.7.0 performance acceptance\n\nThe source passed 224 Node tests with zero failures or skips, strict TypeScript checking, 1,454 exact differential comparisons and sixteen correctness-hashed benchmarks against v0.6 commit `f3dcd9fa6ecdfc4e2944379d0b59b177b7395ad7`. Both benchmark processes ran without CPU-profile instrumentation on the same GitHub runner, with one excluded warmup and three measured repetitions. Separate profiles are retained for four bottleneck workloads.\n\n'+table+'\n## Browser, OCR and export checks\n\nThe original 35-check workbench harness uses its established inline/blob transport; it is not evidence of dedicated HTTP workers. Separate real HTTP suites pass 21 OCR/color, 14 tiled OCR, 23 native IMAGE, 14 sampled appearance and 14 performance/ownership/cancellation checks. The native OCR and IMAGE/appearance CLI, fresh five-case pinned corpus and independent baseline DXF audit passed. The baseline audit covers '+str(dxf['files'])+' generated files with zero errors or automatic fixes. Pages repeats the real browser suites on the deployed HTTPS revision; local success does not imply public deployment.\n\n## Scope and ownership\n\nMetadata-only proposals reuse privately owned transaction indices after complete preflight. General geometry-changing proposals and the public transaction API retain canonical validation. Frozen plugin snapshots, history, rollback, layer first-wins and exact DXF output are preserved. Table output, half-open text membership and thresholded raster pixels match the original implementation. Sauvola accumulator storage for 2000 by 1000 pixels falls from 32,048,016 to 32,000 bytes; this is scratch storage, not total OCR memory. Single-rule proposal iteration now cooperatively yields, without claiming that every synchronous callback is preemptible.\n\nNo customer slow PDF was supplied. Timing ratios are observations, not CI gates or universal speed promises; unchanged workloads can be slower from noise. OCR recognition throughput was not measured, and model/languages/DPI/threshold settings are not lowered. General transactions, PDF rendering, pathological geometry and large raster allocation remain workload-dependent. All sixteen 0.7.0 archives were integrity-checked and imported in a clean offline consumer. No npm registry write was attempted.\n\nEvidence: `artifacts/v0.7.0/`. Source acceptance workflow: https://github.com/wieslawsoltes/RevectorStudio/actions/runs/'+os.environ['GITHUB_RUN_ID']+'.\n'
          (root/'docs/VALIDATION-0.7.md').write_text(doc)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages scripts tests docs README.md package.json package-lock.json
          git add -f -- apps/studio/conversion-worker.js apps/studio/offline-bootstrap.js revector-studio.html release/npm artifacts/v0.7.0
          git commit -m 'Optimize semantic metadata transactions, dense tables and rolling raster preprocessing (v0.7.0)'
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/v07-revision.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-v07-validation
          path: |
            artifacts/
            release/npm/
            ${{ runner.temp }}/performance/
            ${{ runner.temp }}/node-tests.log
            ${{ runner.temp }}/v07-revision.txt
          retention-days: 14
