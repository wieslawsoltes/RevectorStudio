name: Finalize raster recovery v0.4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/upgrade-v04.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged source base and the tested patch checksum
        run: |
          git diff --exit-code 4c1348eb6a821ec76cf653a3042adae230ae84a5 HEAD -- packages scripts tests examples docs README.md package.json package-lock.json
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib
          encoded=''.join(pathlib.Path(f'.bootstrap/v04-{i}.b64').read_text().strip() for i in range(3))
          data=base64.b64decode(encoded,validate=True)
          actual=hashlib.sha256(data).hexdigest()
          assert actual=='08a511672fffac0f8dccc73fb1842f532db7ae1b2ccc90d1986acc1dbe96332d',actual
          pathlib.Path(os.environ['RUNNER_TEMP'],'recovery-v04.patch').write_bytes(lzma.decompress(data))
          PY
          git apply --unidiff-zero --check "$RUNNER_TEMP/recovery-v04.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/recovery-v04.patch"
      - name: Install locked native and browser dependencies
        run: |
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
          python -m pip install -r tests/requirements.txt --quiet
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/browser-install.log"; exit 1; }
          python tests/image_fixture.py
      - name: Build and validate source, types and established conversion behavior
        run: |
          npm run build
          npm test | tee "$RUNNER_TEMP/node-tests.log"
          npm run test:types
          npm run test:browser
          npm run test:extensions
          npm run test:recovery
      - name: Validate real HTTP image retention, pixel colors, DXF references and path tracing
        run: npm run test:images
      - name: Validate native Node IMAGE export and existing OCR CLI
        run: |
          npm run test:images:cli
          python tests/ocr_cli.py
          npm run test:dxf
      - name: Rebuild and validate all sixteen independently installable packages
        run: |
          npm run pack:all
          export PACKAGE_ROOT="$GITHUB_WORKSPACE/release/npm"
          mkdir "$RUNNER_TEMP/v04-consumer"
          cd "$RUNNER_TEMP/v04-consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund "$PACKAGE_ROOT"/*.tgz
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const records=JSON.parse(fs.readFileSync(process.env.PACKAGE_ROOT+'/manifest.json','utf8'));
          if(records.length!==16)throw Error('Expected sixteen packages');
          for(const r of records){
            if(r.version!=='0.4.0')throw Error('Unexpected version '+r.name);
            const hash=createHash('sha256').update(fs.readFileSync(process.env.PACKAGE_ROOT+'/'+r.file)).digest('hex');
            if(hash!==r.sha256)throw Error('Package checksum mismatch '+r.name);
            await import(r.name);console.log('PASS isolated import',r.name);
          }
          JS
      - name: Record measured validation and commit source and distributions
        run: |
          python - <<'PY'
          import json,os,pathlib,re,shutil
          root=pathlib.Path.cwd();out=root/'artifacts/v0.4.0';out.mkdir(parents=True,exist_ok=True)
          node=(pathlib.Path(os.environ['RUNNER_TEMP'])/'node-tests.log').read_text()
          tests=int(re.search(r'# tests (\d+)',node)[1]);assert '# fail 0' in node and tests>=150
          reports={}
          for path in ['browser-validation.json','extensions/validation.json','recovery-next/validation.json','images-browser/validation.json','images-cli/validation.json','ocr-cli/validation.json','dxf-validation.json']:
              source=root/'artifacts'/path;reports[path]=json.loads(source.read_text());shutil.copyfile(source,out/path.replace('/','-'))
          image=reports['images-browser/validation.json'];assert image['passed']==23 and image['transport']=='real HTTP(S)' and not image['errors']
          cli=reports['images-cli/validation.json'];assert cli['passed'] and len(cli['cases'])==4
          dxf=reports['dxf-validation.json'];assert dxf['auditErrors']==dxf['auditFixes']==0
          summary={'version':'0.4.0','sourceBase':'4c1348eb6a821ec76cf653a3042adae230ae84a5','patchSha256':'08a511672fffac0f8dccc73fb1842f532db7ae1b2ccc90d1986acc1dbe96332d','workflowRun':os.environ['GITHUB_RUN_ID'],'nodeTests':tests,'nodeFailures':0,'imageBrowserChecks':image['passed'],'imageDxfVersions':6,'imageDxfPages':2,'nativeImageCliCases':len(cli['cases']),'independentBaselineDxfFiles':dxf['files'],'isolatedNpmImports':16,'imageBrowserTransport':image['transport'],'qualification':'Authored regression fixtures, not universal PDF, OCR or commercial CAD certification.'}
          (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          (root/'docs/VALIDATION-0.4.md').write_text('# Version 0.4.0 validation\n\nThe source update passes '+str(tests)+' Node unit/integration tests with zero failures, strict TypeScript checking, 35 original UI assertions, 21 OCR/color assertions, 14 tiled/deskewed OCR assertions, and 23 new IMAGE/linework browser checks. The new browser suite uses real HTTP navigation; no inline transport is used for the GitHub Actions acceptance gate.\n\n## Native raster images\n\nTwo authored PDF pages each retain four image paints and their native vector. Repeated resources share image definitions; clipped/alpha variants get distinct PNG assets. Both pages export in all six selectable DXF generations: twelve independent audits pass without errors or automatic fixes, and all IMAGE reactors and external files resolve. Reflections, shear, CropBox, UserUnit and page rotation are exercised. The native Node CLI separately passes four page/version cases.\n\nThirteen RGBA sample points per page agree with the PDF.js reference within two byte levels per channel. Twenty-one additional sample points cover ICCBased RGB, CMYK and the interpolation flag. These are measured reference agreements, not certification of every ICC profile, transparency group, blend mode or CAD importer. Preserved images are sRGB PNG resources, not the original compressed PDF streams. Unsupported image states are diagnosed or rejected in strict mode.\n\n## Raster paths and semantics\n\nDeterministic regressions exercise thinning, diagonal strokes, branches, loops, isolated pixels, graph edge coverage, simplification and budgets. The browser test validates estimated linework and source provenance without invoking OCR; established suites independently validate actual Tesseract recognition. Contour-semantic regressions cover circles, concave polygons, boundary endpoints, overlapping regions and malformed candidates. Centerline tracing is inferred geometry, not exact CAD reconstruction.\n\n## Distributions\n\nAll sixteen 0.4.0 npm tarballs were installed and imported in a clean offline consumer and their SHA-256 hashes verified. They have not been published to the npm registry. The general independent baseline DXF audit covers '+str(dxf['files'])+' generated files; that corpus is separate from image-specific audits.\n\nMachine-readable evidence is in `artifacts/v0.4.0/`. The source-update workflow is https://github.com/wieslawsoltes/RevectorStudio/actions/runs/'+os.environ['GITHUB_RUN_ID']+'. Public deployment is verified separately by the Pages workflow.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages scripts tests examples docs README.md package.json package-lock.json assets/raster-placement.pdf
          git add -f -- apps/studio/conversion-worker.js apps/studio/offline-bootstrap.js revector-studio.html release/npm artifacts/v0.4.0 artifacts/images-browser artifacts/images-cli
          git commit -m 'Add native raster IMAGE packages, general centerline tracing and contour-aware semantics (v0.4.0)'
          git push origin HEAD:main
          git rev-parse HEAD > "$RUNNER_TEMP/v04-revision.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-v04-validation
          path: |
            artifacts/
            release/npm/
            ${{ runner.temp }}/node-tests.log
            ${{ runner.temp }}/v04-revision.txt
          retention-days: 14
