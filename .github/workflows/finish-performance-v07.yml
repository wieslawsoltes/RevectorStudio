name: Complete conversion performance v0.7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/finish-performance-v07.yml]
permissions:
  contents: write
concurrency:
  group: revector-source-recovery
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified scheduler refinement and execute every acceptance gate
        run: |
          python -m pip install PyYAML==6.0.2 --quiet
          python - <<'PY'
          import base64,hashlib,lzma,os,pathlib,subprocess,yaml
          encoded=''
          data=base64.b64decode(encoded,validate=True)
          refinement='6bb2db1472c8a97aa616a12f4dee7e45f21b2e4d6b0e2e1393cf83dd4c9ba591'
          assert hashlib.sha256(data).hexdigest()==refinement
          patch=pathlib.Path(os.environ['RUNNER_TEMP'],'fair-scheduler.patch');patch.write_bytes(lzma.decompress(data))
          source=yaml.safe_load(pathlib.Path('.github/workflows/upgrade-performance-v07.yml').read_text())
          count=0
          for step in source['jobs']['validate-and-commit']['steps']:
              if 'run' not in step:continue
              script=step['run']
              if step['name']=='Record measured evidence and commit accepted source and distributions':
                  assert 'tests==224' in script and 'passed 224 Node' in script
                  script=script.replace('tests==224','tests==226').replace('passed 224 Node','passed 226 Node')
                  script=script.replace("'workflowRun':os.environ['GITHUB_RUN_ID']", "'schedulerRefinementSha256':'"+refinement+"','workflowRun':os.environ['GITHUB_RUN_ID']")
              print('EXECUTE',step['name'],flush=True)
              subprocess.run(['bash','-e','-o','pipefail','-c',script],check=True)
              count+=1
              if step['name']=='Verify unchanged source and exact patch checksum':
                  subprocess.run(['git','apply','--check',str(patch)],check=True)
                  subprocess.run(['git','apply',str(patch)],check=True)
          assert count==10,count
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revector-v07-validation
          path: |
            artifacts/
            release/npm/
            ${{ runner.temp }}/performance/
            ${{ runner.temp }}/node-tests.log
            ${{ runner.temp }}/v07-revision.txt
          retention-days: 14
