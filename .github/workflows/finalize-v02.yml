name: Finalize verified v0.2 distribution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-v02.yml]
permissions:
  contents: write
concurrency:
  group: revector-release-refresh
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused compatibility and documentation corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(name,old,new):
              p=Path(name);s=p.read_text();assert s.count(old)==1,(name,old);p.write_text(s.replace(old,new))
          replace('packages/ocr/src/index.js','logger:this.options.onProgress','logger:typeof this.options.onProgress === \'function\' ? this.options.onProgress : () => {}')
          replace('tests/ocr-provider.test.mjs','async createWorker(language, engine) {','async createWorker(language, engine, options) {\n        assert.equal(typeof options.logger, \'function\');\n        options.logger({ status: \'loading\', progress: 0 });')
          p=Path('packages/ocr/src/index.d.ts');s=p.read_text();s=s.replace('provider?:{createWorker:Function}', 'provider?:{createWorker:Function}|{default:{createWorker:Function}}');p.write_text(s)
          replace('packages/workbench/src/index.js',"el('b', { text: 'No raster tracing' }), el('span', { text: 'Only PDF vectors and encoded text enter the CAD model.' })", "el('b', { text: this.result?.report.ocr ? 'Raster OCR recovery' : 'Vector-first recovery' }), el('span', { text: this.result?.report.ocr ? `${this.result.report.ocr.accepted} inferred words · ${this.result.report.ocr.lines} estimated lines. Native text is preserved.` : 'Native vectors and encoded text are preserved. Raster OCR is opt-in.' })")
          replace('packages/workbench/src/index.js',"['Raster images', 'Not traced / not exported']", "['Raster recovery', this.result.report.ocr ? `${this.result.report.ocr.accepted} OCR words · ${this.result.report.ocr.lines} estimated lines` : 'OCR off'], ['Image embedding', 'Not exported']")
          for p in Path('packages').glob('*/README.md'):
              s=p.read_text().replace('Revector Studio 0.1.0','Revector Studio 0.2.0').replace('No OCR or raster tracing is performed.','Native conversion remains vector-first. Optional @revector/ocr adds inferred raster text and ruled lines with confidence and provenance.').replace('No OCR or raster tracing.','Raster recognition is composed through @revector/ocr.')
              p.write_text(s)
          p=Path('docs/INTEGRATION.md');s=p.read_text().replace('the twelve packages','the sixteen packages').replace('@revector/*@0.1.0','@revector/*@0.2.0').replace("assetBase: '/vendor/pdfjs/',", "assetBase: '/vendor/pdfjs/',\n  ocrAssetBase: '/vendor/ocr/',")
          s=s.replace('Browser workers were blocked by the delivery environment; its kernel was tested in Node worker_threads and its explicit browser fallback was exercised. A deployed-browser worker smoke test remains an integration acceptance item.','CI exercises the actual PDF.js and conversion browser workers under HTTP and HTTPS, in addition to the Node worker kernel. Raster OCR runs in a separate Tesseract worker.')
          s=s.replace('No deployment has been made as part of this source delivery.','GitHub Pages publication and real-browser verification are configured in `.github/workflows/pages.yml`; see `docs/PUBLISHING.md`.')
          s=s.replace('The app does not call PDF document JavaScript actions or invoke OCR.','The app does not call PDF document JavaScript actions. Raster OCR is explicitly opt-in and uses self-hosted runtime and language assets.')
          s+='\n## Optional raster OCR\n\nSee [EXTENSIONS.md](EXTENSIONS.md) for reusable OCR, preprocessing, language, confidence, cancellation and coordinate contracts. OCR is not part of exact vector transcription. The standalone HTML embeds the PDF engine but needs adjacent `vendor/ocr/` assets for raster recognition.\n'
          p.write_text(s)
          p=Path('docs/PUBLISHING.md');s=p.read_text().replace('twelve npm archives','sixteen npm archives').replace('The twelve packages','The sixteen packages').replace('twelve packages','sixteen packages').replace('npm install --ignore-scripts --omit=optional','npm ci --ignore-scripts --include=optional')
          s+='\n## Version 0.2 validation gates\n\nCI and Pages run real browser OCR on a mixed raster/native-text PDF, rotated-page recovery, eleven color swatches and all six OCR-to-DXF versions. A separate Node test executes the CLI with native Canvas and the WASM OCR engine. The deployment workflow repeats browser OCR and color checks on the public HTTPS site. Runtime, core and English/German/Polish model files are served from `vendor/ocr/`; recognition does not upload document bytes.\n'
          p.write_text(s)
          p=Path('docs/EXTENSIONS.md');s=p.read_text().replace('Page pixel, region and word budgets bound allocations;', 'Page pixel, region and word budgets bound requested OCR work, not all internal PDF/WASM decoder allocations;')
          s+='\n## Corrected page orientation\n\nCAD coordinates now flip the destination canvas Y axis after applying the normal PDF.js viewport transform. Four real-PDF regressions cover rotations 0/90/180/270 with a nonzero CropBox and UserUnit=2. This fixes a previous quarter-turn orientation error affecting native text as well as OCR.\n\nTesseract provider integration accepts a named API or an ES-module default API and supplies a no-op progress callback when none is provided. The real Node OCR regression covers the callback path in addition to browser recognition.\n'
          p.write_text(s)
          PY
      - name: Install locked runtime and test dependencies
        run: |
          npm ci --ignore-scripts --include=optional --no-audit --no-fund
          node scripts/link-workspaces.mjs
          python -m pip install -r tests/requirements.txt --quiet
          python -m playwright install --with-deps chromium > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -100 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Validate real OCR and refresh all compiled distributions
        run: |
          npm run build
          npm test | tee "$RUNNER_TEMP/node-tests.txt"
          npm run test:types
          npm run test:browser
          npm run test:extensions
          python tests/ocr_cli.py
          npm run test:dxf
          npm run pack:all
      - name: Verify sixteen npm packages in an isolated offline consumer
        run: |
          export PACKAGE_ROOT="$GITHUB_WORKSPACE/release/npm"
          mkdir "$RUNNER_TEMP/revector-consumer"
          cd "$RUNNER_TEMP/revector-consumer"
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --offline --ignore-scripts --no-audit --no-fund "$PACKAGE_ROOT"/*.tgz
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync(process.env.PACKAGE_ROOT+'/manifest.json','utf8'));
          if(manifest.length!==16)throw Error('Expected sixteen packages');
          for(const item of manifest){await import(item.name);console.log('PASS consumer import',item.name);}
          JS
      - name: Record validation and commit refreshed source and distributions
        run: |
          python - <<'PY'
          import json,os,pathlib,re,shutil
          root=pathlib.Path.cwd();out=root/'artifacts/v0.2.0';out.mkdir(exist_ok=True)
          for name in ['browser-validation.json','dxf-validation.json','extensions/validation.json','ocr-cli/validation.json']:
              source=root/'artifacts'/name
              shutil.copyfile(source,out/name.replace('/','-'))
          node=(pathlib.Path(os.environ['RUNNER_TEMP'])/'node-tests.txt').read_text()
          tests=int(re.search(r'# tests (\d+)',node)[1]);assert '# fail 0' in node
          extensions=json.loads((root/'artifacts/extensions/validation.json').read_text());assert extensions['passed']==21
          dxf=json.loads((root/'artifacts/dxf-validation.json').read_text());assert dxf['auditErrors']==dxf['auditFixes']==0
          cli=json.loads((root/'artifacts/ocr-cli/validation.json').read_text());assert cli['passed']
          evidence={'version':'0.2.0','testedSourceParent':os.environ['GITHUB_SHA'],'workflowRun':os.environ['GITHUB_RUN_ID'],'nodeTests':tests,'nodeFailures':0,'browserWorkflowChecks':35,'browserOcrColorChecks':21,'independentDxfFiles':dxf['files'],'ocrDxfVersions':6,'nativeNodeOcr':True,'isolatedNpmImports':16,'qualification':'Authored regression fixtures, not exhaustive document or printer coverage. Recognition and semantics remain inferred.'}
          (out/'summary.json').write_text(json.dumps(evidence,indent=2)+'\n')
          (root/'docs/VALIDATION-0.2.md').write_text('# Version 0.2.0 validation\n\nThe recorded build passes '+str(tests)+' Node tests, strict TypeScript checking, 35 original UI checks, 21 real-browser OCR/color checks, native Node/WASM OCR, and installation/import of all sixteen npm archives in an isolated offline consumer.\n\nAll eleven authored color swatches agree between PDF.js rendering and the rendered serialized DXF at the sampled interior pixels. Six OCR-to-DXF version exports pass independent audits. The separate baseline DXF audit covers '+str(dxf['files'])+' files with zero errors and zero fixes. These fixtures are not an exhaustive customer-document corpus, OCR accuracy benchmark, or commercial CAD certification.\n\nMachine-readable evidence is in `artifacts/v0.2.0/`. The live Pages workflow repeats the OCR/color tests on the deployed HTTPS URL and records the actual deployment commit.\n')
          p=root/'README.md';p.write_text(p.read_text()+'\n## Current validation\n\nSee [version 0.2.0 validation](docs/VALIDATION-0.2.md) for real browser/CLI OCR, color swatches, rotation regressions and isolated npm installation. Historical 0.1.0 evidence is retained separately.\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- packages/ocr/src packages/workbench/src/index.js packages/*/README.md tests/ocr-provider.test.mjs docs README.md apps/studio/conversion-worker.js apps/studio/offline-bootstrap.js revector-studio.html release/npm artifacts/v0.2.0
          git commit -m 'Finalize tested v0.2 OCR defaults, accurate UI contracts and sixteen distributable packages'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-v02-validation
          path: |
            artifacts/
            release/npm/
          retention-days: 14
